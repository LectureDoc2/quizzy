name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a release can depend on this workflow having passed for the same commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known advisories in what the server actually runs. Exceptions live in
      # pnpm-workspace.yaml (auditConfig), each with its reason and its expiry.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # pnpm-workspace.yaml blocks dependency lifecycle scripts, so Playwright's
      # postinstall never fetches a browser. That is deliberate -- a production
      # host has no use for several hundred megabytes of Chromium -- which means
      # CI has to ask for it explicitly.
      - name: Install Chromium for the browser tests
        run: pnpm --filter ld-quiz-server exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

      - name: Browser tests
        run: pnpm test:browser

      - name: Build the client bundles
        run: pnpm build

      # A publish that fails on its own manifest is a bad way to find out.
      - name: Check the package would pack
        run: npm pack --dry-run
        working-directory: packages/ld-quiz
