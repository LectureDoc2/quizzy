name: Release

# Publishes @lecturedoc2/quizzy when a `v*` tag is pushed.
#
# This workflow produces a *provenance attestation*: a signed statement, recorded in a
# public transparency log, that says which commit of which repository was built
# by which workflow to make this exact tarball. npm shows it on the package page
# and `npm audit signatures` verifies it. 
#
# npm is used for the publish rather than pnpm because OIDC token exchange is
# implemented in the npm CLI. pnpm still installs the workspace.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve and pack, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The same suite CI runs, against the exact commit being released.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # mints the OIDC token; also required for provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use a current npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/ld-quiz/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
          echo "publishing @lecturedoc2/quizzy@$pkg"

      - name: Publish
        working-directory: packages/ld-quiz
        run: npm publish --provenance ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}

