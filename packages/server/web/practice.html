<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Texts come from locales/<lang>.json, by key; see js/i18n.js. -->
        <title data-i18n="page.practiceTitle">Quizzy</title>
        <link rel="stylesheet" href="/styles/quiz-ui.css" />
        <link rel="stylesheet" href="/styles/join.css" />
        <style>
            body {
                background-image: url("background.png");
                background-size: cover;
                font-family: system-ui, sans-serif;
                position: relative;

                &::after {
                    content: "(c) 2026 - Created by M. Eichberg using Claude and other AI-assistants; the background image is created using ChatGPT.";
                    color: lightgray;
                }
            }
        </style>
    </head>
    <body>
        <div class="container container--wide card">
            <h1 data-i18n="practiceList.heading"></h1>
            <p class="practice__intro" data-i18n="practiceList.intro"></p>
            <div id="practice-list" class="practice__list">
                <div class="waiting">
                    <div class="spinner"></div>
                    <p data-i18n="practiceList.loading"></p>
                </div>
            </div>
            <p class="join-privacy" data-i18n="privacy.practice"></p>
        </div>
        <script type="module" src="/js/practice-list.js"></script>
    </body>
</html>
